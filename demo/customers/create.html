<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Customer</title>
        <style>
            body { margin: 0; padding: 32px; background: #f5f3ff; color: #1f2937; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
            main { max-width: 620px; margin: 0 auto; }
            h1 { font-size: 22px; margin: 0 0 20px; }
            form { display: grid; gap: 14px; }
            .field { display: grid; gap: 6px; }
            label { font-weight: 600; font-size: 12px; color: #374151; }
            input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font: inherit; }
            pre { margin-top: 24px; padding: 14px; border-radius: 10px; background: #111827; color: #a5f3fc; font-size: 12px; }
        </style>
    </head>
    <body>
        <main>
            <h1>Create Customer</h1>
            <form id="zoo">
                <div class="field"><label for="name">Name *</label><input id="name" name="name" required /></div>
                <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" /></div>
                <div class="field"><label for="role">Role</label><input id="role" name="role" /></div>
            </form>
            <pre id="log">values…</pre>
        </main>
        <script>
            const form = document.getElementById('zoo');
            const log = document.getElementById('log');
            form.addEventListener('input', () => {
                log.textContent = [...form.querySelectorAll('input')].map((input) => `${input.name}: ${input.value}`).join('\n');
            });
        </script>
    </body>
</html>
